# Site configuration — https://gohugo.io/configuration/
baseURL = "https://victortaillieu.github.io/"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 0

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

# Only tags are used (shown on posts). Hugo's defaults would also add categories.
[taxonomies]
  tag = "tags"

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]  # JSON powers the search

[related]
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
  [[related.indices]]
    name = "fragmentrefs"
    type = "fragments"
    applyFilter = false
    weight = 10
