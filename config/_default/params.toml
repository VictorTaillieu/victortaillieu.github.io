# Theme options — only values that differ from Blowfish defaults.
# Defaults: https://github.com/nunocoracao/blowfish/blob/main/config/_default/params.toml
# Docs:     https://blowfish.page/docs/configuration/#theme-parameters

disableImageOptimizationMD = true
smartTOC = true
enableCodeCopy = true

[header]
  layout = "fixed-gradient"

[article]
  showHero = true
  heroStyle = "basic"
  showAuthorBottom = true
  showTableOfContents = true
  showWordCount = false
  showZenMode = true
  showTaxonomies = true  # tags under the post title

[list]
  showSummary = true
